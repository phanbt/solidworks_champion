<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who is the SOLIDWORKS Champion?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a CAD viewport stage — question "sheet" on a blueprint grid at left, points ladder as a dimension scale at right. Single dark studio look by choice. */
:root{
  --bg:#101318; --panel:#181c23; --panel-2:#1f242d; --line:#2d3440; --grid:rgba(120,160,210,.06);
  --fg:#e7ebf0; --muted:#8d97a6; --accent:#f2a33a; --select:#4cb3e6;
  --good:#3fbf7f; --bad:#e2564d;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 64px;
}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.hud{display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud b{display:block;font-family:var(--display);font-size:24px;color:var(--fg);font-weight:600}
.hud .player b{max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-right{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.btn.small{font-size:14px;padding:7px 14px}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;max-width:360px}
.field label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input{background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font:500 16px var(--body)}
.field input:focus-visible{outline:2px solid var(--select);outline-offset:1px;border-color:var(--select)}
.field .err{font-size:13px;color:var(--bad);min-height:1.2em}
.summary{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.summary th,.summary td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line)}
.summary th:first-child,.summary td:first-child{text-align:left}
.summary th{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.summary tfoot td{font-weight:600;border-bottom:0}
.table-wrap{overflow-x:auto}
.meter{height:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;position:relative;overflow:visible}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter i.champ{background:var(--good)}
.meter .goal{position:absolute;top:-5px;bottom:-5px;left:80%;border-left:2px dashed var(--fg)}
.meter-labels{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted);margin-top:6px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}.ladder{order:2}}

.sheet{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0;position:relative}
.sheet::before,.sheet::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--accent);border-style:solid;opacity:.7}
.sheet::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.sheet::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tag{padding:2px 8px;border:1px solid var(--line);border-radius:3px}
.tag.d1{color:var(--good)} .tag.d2{color:var(--accent)} .tag.d3{color:var(--bad)}
.question{font-family:var(--display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:0;text-wrap:balance}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.answers{grid-template-columns:1fr}}
.ans{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:4px;
  padding:13px 14px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;min-height:58px
}
.ans:hover:not(:disabled){border-color:var(--select)}
.ans:active:not(:disabled){transform:translateY(1px)}
.ans:focus-visible,.btn:focus-visible,.life:focus-visible{outline:2px solid var(--select);outline-offset:2px}
.ans .k{font-family:var(--mono);font-weight:500;color:var(--accent);min-width:1.4em}
.ans.sel{border-color:var(--select);background:color-mix(in srgb,var(--select) 16%,var(--panel-2))}
.ans.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--panel-2))}
.ans.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--panel-2))}
.ans.gone{opacity:.18;pointer-events:none}
.ans:disabled{cursor:default}

.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.lifelines{display:flex;gap:8px;flex-wrap:wrap}
.life{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:500 13px var(--body);cursor:pointer}
.life:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.life:disabled{opacity:.35;cursor:default;text-decoration:line-through}
.life svg{width:16px;height:16px;flex:none}
.btn{background:var(--accent);color:#1a1206;border:0;border-radius:4px;padding:10px 20px;font:700 17px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}

.note{border-left:3px solid var(--line);padding:10px 14px;background:var(--panel-2);border-radius:0 4px 4px 0;font-size:14px}
.note.good{border-color:var(--good)} .note.bad{border-color:var(--bad)} .note.expert{border-color:var(--select)}
.note strong{font-family:var(--display);font-size:17px;letter-spacing:.03em;display:block}

.ladder{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 0;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.ladder h2{font:600 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 16px 8px}
.ladder ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse}
.ladder li{display:grid;grid-template-columns:2.2em 1fr auto;gap:6px;align-items:center;padding:3px 16px;color:var(--muted);position:relative}
.ladder li::before{content:"";position:absolute;left:0;top:50%;width:8px;border-top:1px solid var(--line)}
.ladder li:nth-child(5n)::before{width:12px;border-color:var(--muted)}
.ladder li.cur{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--fg)}
.ladder li.cur::before{border-color:var(--accent);width:14px}
.ladder li.won .pts{color:var(--good)}
.ladder li.lost .pts{color:var(--bad);text-decoration:line-through}
.ladder li .mk{text-align:right;width:1em}
@media (max-width:820px){
  .ladder ol{flex-direction:row;flex-wrap:wrap;gap:4px;padding:0 16px}
  .ladder li{display:flex;padding:4px 6px;border:1px solid var(--line);border-radius:3px;gap:4px}
  .ladder li::before,.ladder li .mk{display:none}
  .ladder li .pts{display:none}
  .ladder li.cur .pts{display:inline}
}

.intro{display:flex;flex-direction:column;gap:14px}
.intro p{margin:0;max-width:62ch;color:var(--fg)}
.intro ul{margin:0;padding-left:1.2em;color:var(--muted);max-width:62ch;display:flex;flex-direction:column;gap:4px}
.result-score{font-family:var(--display);font-size:clamp(48px,9vw,80px);font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rank{font-family:var(--display);font-size:26px;font-weight:600}
.review{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:4px}
.review .item{font-size:13.5px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.review .item b{color:var(--good);font-weight:600}

.copy{position:fixed;left:0;bottom:0;padding:8px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:12px;color:var(--muted);background:linear-gradient(transparent,var(--bg) 40%);z-index:5;pointer-events:none}
/* Phone layout */
@media (max-width:600px){
  body{padding-block:14px 24px}
  .hud-right{width:100%;flex-direction:column;align-items:stretch;gap:10px}
  .hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;font-size:11px}
  .hud .player{grid-column:1/-1}
  .hud b{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud .player b{max-width:none}
  #restartBtn{align-self:flex-start}
  .sheet{padding:16px}
  .ans{min-height:52px;padding:12px}
  .controls .btn:not(.small){flex:1 1 100%}
  .summary{font-size:13px}
  .summary th,.summary td{padding:7px 6px}
  .summary th{font-size:10.5px;letter-spacing:.04em}

  .meter-labels{flex-direction:column;gap:2px}
  .result-score span{white-space:nowrap}
  .copy{position:static;background:none;padding:18px 0 0;text-align:left}
  .review{max-height:none}
}
@media (max-width:380px){
  .summary{font-size:12px}
  .summary th,.summary td{padding:7px 3px}
  .summary th{font-size:9.5px;letter-spacing:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <small>SOLIDWORKS · 3DEXPERIENCE quiz</small>
      <h1>Who is the <em>SOLIDWORKS</em> Champion?</h1>
    </div>
    <div class="hud-right">
      <div class="hud" aria-live="polite">
        <div class="player">Player<b id="hudN">–</b></div>
        <div>Question<b id="hudQ">–</b></div>
        <div>Correct<b id="hudC">0</b></div>
        <div>Points<b id="hudP">0</b></div>
      </div>
      <button class="btn ghost small" id="restartBtn" hidden>Restart game</button>
    </div>
  </header>

  <div class="stage">
    <section class="sheet" id="sheet" aria-live="polite"></section>
    <aside class="ladder">
      <h2>Points ladder</h2>
      <ol id="ladder"></ol>
    </aside>
  </div>
</div>

<div class="copy">© PHAN Bá Thông aka Grandpa</div>

<script>
// ---------- Question bank: 50 questions. a[0] is the correct answer (shuffled at runtime). d: 1 easy, 2 medium, 3 hard ----------
const BANK = [
 {d:1,q:"What is the file extension of a SOLIDWORKS part?",a:[".SLDPRT",".SLDASM",".SLDDRW",".CATPart"],x:"Parts are .SLDPRT, assemblies .SLDASM, drawings .SLDDRW."},
 {d:1,q:"What is the file extension of a SOLIDWORKS assembly?",a:[".SLDASM",".SLDPRT",".ASMDOC",".STEP"],x:".SLDASM stores the assembly structure and mates. It references the part files."},
 {d:1,q:"What is the file extension of a SOLIDWORKS drawing?",a:[".SLDDRW",".DWG",".SLDDOT",".SLDPRT"],x:".SLDDRW is the native drawing. .DWG is the AutoCAD format SOLIDWORKS can export to."},
 {d:1,q:"Which company develops SOLIDWORKS and the 3DEXPERIENCE platform?",a:["Dassault Systèmes","Autodesk","PTC","Siemens Digital Industries"],x:"SOLIDWORKS has been part of Dassault Systèmes since 1997, which also develops the 3DEXPERIENCE platform and CATIA."},
 {d:1,q:"Which panel lists the features of a part in the order they were created?",a:["FeatureManager design tree","PropertyManager","Task Pane","CommandManager"],x:"The FeatureManager design tree on the left shows the history of features, planes, sketches and bodies."},
 {d:1,q:"What are the three default reference planes in a new part?",a:["Front, Top, Right","Front, Back, Side","XY, YZ, ZX","Top, Bottom, Left"],x:"Every new part starts with Front Plane, Top Plane and Right Plane plus the Origin."},
 {d:1,q:"By default, what color is a fully defined sketch?",a:["Black","Blue","Red","Green"],x:"Black means fully defined, blue means under-defined, and red or yellow flags over-defined or conflicting geometry."},
 {d:1,q:"By default, what color is under-defined sketch geometry?",a:["Blue","Black","Yellow","Grey"],x:"Blue geometry can still move. Add dimensions or relations until it turns black."},
 {d:1,q:"Which feature adds material by projecting a 2D sketch along a straight direction?",a:["Extruded Boss/Base","Revolved Boss/Base","Swept Boss/Base","Lofted Boss/Base"],x:"Extruded Boss/Base pushes a closed profile a set distance, or up to a face, vertex or surface."},
 {d:1,q:"Which feature creates a solid by rotating a sketch around an axis or centerline?",a:["Revolved Boss/Base","Extruded Boss/Base","Mirror","Circular Pattern"],x:"Revolve is the natural choice for shafts, knobs, bottles and other rotationally symmetric parts."},
 {d:1,q:"Which feature rounds the edges of a model?",a:["Fillet","Chamfer","Draft","Shell"],x:"Fillet makes rounded edges. Chamfer makes beveled (flat angled) edges."},
 {d:1,q:"What does the Shell feature do?",a:["Hollows a solid, leaving walls of constant thickness","Wraps a sketch onto a curved face","Turns a solid into surfaces","Adds a thin rib between two walls"],x:"Shell removes the inside material and leaves a thin wall. The faces you select are left open."},
 {d:1,q:"In an assembly, what is the default state of the first component you insert?",a:["Fixed","Floating","Flexible","Suppressed"],x:"The first component is fixed at the assembly origin. Others float until you mate them."},
 {d:1,q:"What is a relationship that positions components relative to each other in an assembly called?",a:["Mate","Relation","Constraint set","Link"],x:"Mates (coincident, concentric, distance, angle and others) remove degrees of freedom between components."},
 {d:1,q:"Which tool creates standard holes such as counterbores, countersinks and tapped holes?",a:["Hole Wizard","Simple Hole Builder","Thread Designer","Toolbox Browser"],x:"Hole Wizard builds holes to standards such as ANSI and ISO, and the hole callouts flow into drawings."},
 {d:1,q:"Which drawing view shows the inside of a part by cutting through it?",a:["Section view","Detail view","Projected view","Auxiliary view"],x:"Section views cut along a line and show hatched material. Detail views zoom into an area."},
 {d:1,q:"Which tool adds dimensions to sketches and drawings?",a:["Smart Dimension","Measure","Autodimension Scheme","DimXpert Annotate"],x:"Smart Dimension works out the dimension type (linear, radial, angular) from what you select."},

 {d:2,q:"Which mouse action rotates the model view by default?",a:["Hold and drag the middle mouse button","Hold and drag the right mouse button","Scroll the wheel","Ctrl + left-click and drag"],x:"Middle drag rotates, Ctrl + middle drag pans, and the scroll wheel zooms."},
 {d:2,q:"Which keyboard shortcut gives a Normal To view?",a:["Ctrl+8","Ctrl+1","Ctrl+N","Shift+N"],x:"Ctrl+8 orients the view perpendicular to the selected face or plane, which helps when sketching."},
 {d:2,q:"What does pressing the Spacebar in the graphics area open?",a:["The Orientation dialog / View Selector","The Shortcut toolbar","The Search box","The Rebuild command"],x:"Spacebar opens view orientation. The S key opens the Shortcut toolbar."},
 {d:2,q:"What does a Sweep feature need?",a:["A profile and a path","Two or more profiles","A profile and an axis","A surface and a thickness"],x:"Sweep moves a profile along a path. Guide curves are optional."},
 {d:2,q:"Which feature creates a shape by blending between two or more profiles?",a:["Loft","Sweep","Boundary Wrap","Revolve"],x:"Loft makes a transition between profiles on different planes. Guide curves control the shape between them."},
 {d:2,q:"Which application drives a SOLIDWORKS Design Table?",a:["Microsoft Excel","Microsoft Access","Notepad","Microsoft Word"],x:"A Design Table is an embedded Excel sheet that creates configurations by changing dimensions and feature states."},
 {d:2,q:"What do configurations let you do?",a:["Keep several variations of a part or assembly in one file","Store custom user interface layouts","Link a part to several drawings","Define material libraries"],x:"Configurations let one file hold size variations, simplified versions or states such as exploded and collapsed."},
 {d:2,q:"Which keyboard shortcut rebuilds the model?",a:["Ctrl+B","Ctrl+R","F5","Ctrl+Z"],x:"Ctrl+B rebuilds changed features. Ctrl+Q forces a rebuild of every feature."},
 {d:2,q:"In sheet metal, what does the K-factor describe?",a:["Where the neutral axis sits, as a ratio of the material thickness","The minimum bend radius","The spring-back angle after bending","The relief width at a bend"],x:"K = t / T, where t is the distance from the inside face to the neutral axis. It drives the flat pattern length."},
 {d:2,q:"Which mate makes two cylindrical faces share the same axis?",a:["Concentric","Coincident","Parallel","Tangent"],x:"Concentric aligns the axes of cylinders, cones and circular edges, which is typical for a bolt in a hole."},
 {d:2,q:"Which tool checks whether components in an assembly overlap?",a:["Interference Detection","Collision Check Mate","Clearance Wizard","Design Checker"],x:"Interference Detection on the Evaluate tab lists overlapping volumes between components."},
 {d:2,q:"What does Pack and Go do?",a:["Collects a model and all its referenced files into a folder or zip","Packs an assembly into a single part","Exports the model to a 3D PDF","Uploads the design to the cloud"],x:"Pack and Go keeps the references intact and can add prefixes or suffixes to file names."},
 {d:2,q:"What is SOLIDWORKS Toolbox?",a:["A library of standard hardware such as bolts, nuts, bearings and pins","A set of sketch tools","An add-in for rendering","A macro editor"],x:"Toolbox generates standard components to ANSI, ISO, DIN and other standards that you can drag into assemblies."},
 {d:2,q:"What is eDrawings used for?",a:["Viewing, measuring and marking up 3D models and drawings in a lightweight viewer","Generating CNC toolpaths","Running finite element analysis","Managing file revisions"],x:"eDrawings lets people outside engineering view designs without a full CAD license."},
 {d:2,q:"How are reference (driven) dimensions shown in a drawing by default?",a:["In parentheses","In red","With a box around them","Underlined"],x:"Reference dimensions appear in parentheses. They report geometry but do not drive it."},
 {d:2,q:"What does a Bill of Materials (BOM) in a drawing list?",a:["The components of an assembly with their quantities","The features of a part","Every dimension on the sheet","The revision history"],x:"The BOM is linked to the assembly and updates when components change. Balloons reference its item numbers."},
 {d:2,q:"What does a Cosmetic Thread do?",a:["Shows a thread without modeling helical geometry","Cuts a real helical thread","Adds a thread to the Toolbox library","Applies a thread texture during rendering"],x:"Cosmetic threads keep the model light and still produce correct thread callouts on drawings."},

 {d:3,q:"Which numerical method does SOLIDWORKS Simulation use for structural analysis?",a:["Finite Element Analysis (FEA)","Computational Fluid Dynamics (CFD)","Monte Carlo method","Boundary Element Method only"],x:"Simulation meshes the model into small elements and solves for displacement, stress, strain and factor of safety."},
 {d:3,q:"What does SOLIDWORKS Flow Simulation analyze?",a:["Fluid flow and heat transfer (CFD)","Stress and strain in solids","Mold filling of plastic parts","Tolerance stack-up"],x:"Flow Simulation is the CFD tool for internal and external flows, cooling of electronics and HVAC."},
 {d:3,q:"In a static study, what does a factor of safety below 1 mean?",a:["The stress exceeds the material limit, so failure is predicted","The design is twice as strong as needed","The mesh is too coarse","The load is applied in the wrong direction"],x:"FOS = material limit / actual stress. Below 1 means the stress is above the yield (or chosen) limit."},
 {d:3,q:"What is the main job of SOLIDWORKS PDM?",a:["Store files in a secure vault with version control and workflows","Render photorealistic images","Generate manufacturing toolpaths","Simulate assembly motion"],x:"PDM handles check-in and check-out, revisions, approval workflows and where-used searches."},
 {d:3,q:"What does SpeedPak do in a large assembly?",a:["Creates a simplified configuration of a subassembly that keeps only selected faces","Compresses the file to save disk space","Turns all parts into lightweight parts permanently","Converts the assembly into a single part"],x:"SpeedPak keeps the geometry you need for mating and drops the rest, which speeds up the top-level assembly."},
 {d:3,q:"What does Lightweight mode load for a component?",a:["Only part of the model data, the rest loads when needed","Only the drawings","Only the cosmetic appearances","Nothing until the user clicks on it"],x:"Lightweight components open faster and use less memory. Full data loads when you edit or select features."},
 {d:3,q:"In Weldments, what automatically groups identical structural members?",a:["The cut list","The BOM table","The Toolbox folder","The weld bead table"],x:"The weldment cut list groups identical bodies with lengths and angles, ready for a cut list table on the drawing."},
 {d:3,q:"What does SOLIDWORKS MBD (Model Based Definition) let you do?",a:["Put manufacturing information (PMI) directly on the 3D model","Model with bidirectional database links","Build motion studies from block diagrams","Run batch translations of files"],x:"MBD puts dimensions, tolerances and notes on the 3D model, often published as 3D PDF or STEP 242, instead of 2D drawings."},
 {d:3,q:"What is the 3DEXPERIENCE platform?",a:["A cloud-based platform that connects design, simulation, data management and collaboration apps","A rendering add-in for SOLIDWORKS","A file translator for CAD formats","A licensing server for SOLIDWORKS desktop"],x:"3DEXPERIENCE gathers apps, data and people in one environment, accessed in a web browser or through connected desktop apps."},
 {d:3,q:"Which 3DEXPERIENCE role connects SOLIDWORKS desktop so it saves directly to the platform?",a:["Collaborative Designer for SOLIDWORKS","3D Creator","3DSwym Community Member","Structural Designer"],x:"Collaborative Designer for SOLIDWORKS adds the MySession panel and stores data in Collaborative Spaces."},
 {d:3,q:"What is xDesign on the 3DEXPERIENCE platform?",a:["A browser-based 3D CAD modeling app","A desktop drawing viewer","A simulation post-processor","A plugin for Microsoft Excel"],x:"xDesign runs in the web browser, saves to the cloud, and is part of roles such as 3D Creator."},
 {d:3,q:"What is 3DSwym used for?",a:["Social collaboration: communities, posts, Q&A and sharing ideas","Sweeping profiles along paths","Swapping assembly components","Managing BOM symmetry"],x:"3DSwym is the community app of the platform for discussions, wikis, media and questions."},
 {d:3,q:"Which 3DEXPERIENCE app works like a cloud drive for storing and sharing any type of file?",a:["3DDrive","3DPlay","3DDashboard","Bookmark Editor"],x:"3DDrive stores, syncs and shares any file type, much like a consumer cloud drive."},
 {d:3,q:"What is 3DPlay used for?",a:["Viewing, measuring and marking up 3D data in a browser","Recording motion studies","Playing training videos","Running animations in PhotoView 360"],x:"3DPlay is the lightweight 3D viewer of the platform, with sections, measurements and markups."},
 {d:3,q:"On 3DEXPERIENCE, what is the default maturity state of a newly saved object?",a:["In Work","Frozen","Released","Draft"],x:"The default lifecycle is In Work → Frozen → Released → Obsolete."},
 {d:3,q:"On the 3DEXPERIENCE platform, where are design data stored?",a:["In Collaborative Spaces on the platform","In a local Windows folder only","On a USB license dongle","Inside the eDrawings cache"],x:"Collaborative Spaces control who can see and edit content, with access roles such as Author, Contributor and Leader."}
];

// ---------- Game config ----------
const LADDER = [100,200,300,500,750,1000,1500,2000,3000,4000,5000,6500,8000,10000,12500,15000,20000,25000,32000,40000];
const MIX = {1:7,2:7,3:6};          // easy, medium, hard picked per game
const EXPERT_ACC = {1:.95,2:.8,3:.65};
const DIFF = {1:"Easy",2:"Medium",3:"Hard"};
const KEYS = ["A","B","C","D"];

let S;
const $ = id => document.getElementById(id);
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const TOTAL = LADDER.reduce((a,b)=>a+b,0);
const CHAMP_PCT = 0.8;
let lastName = "";
try { lastName = localStorage.getItem("swChampName") || ""; } catch(e) {}

function newGame(name){
  const picks=[];
  for(const d of [1,2,3]){
    const pool = BANK.map((q,i)=>({...q,id:i})).filter(q=>q.d===d);
    picks.push(...shuffle(pool).slice(0,MIX[d]));
  }
  return {
    name, phase:"play", i:0, points:0, correct:0, sel:null, locked:false,
    used5050:false, usedExpert:false, hidden:[], expertMsg:null,
    results:[],
    qs:picks.map(q=>{ const order=shuffle([0,1,2,3]); return {id:q.id,d:q.d,q:q.q,x:q.x,opts:order.map(k=>q.a[k]),ans:order.indexOf(0)}; })
  };
}

function renderLadder(){
  const ol=$("ladder"); ol.innerHTML="";
  LADDER.forEach((p,i)=>{
    const li=document.createElement("li");
    const r=S&&S.results[i];
    if(S&&S.phase==="play"&&i===S.i) li.className="cur";
    if(r===true) li.classList.add("won"); if(r===false) li.classList.add("lost");
    li.innerHTML=`<span>${String(i+1).padStart(2,"0")}</span><span class="pts">${p.toLocaleString("en-US")}</span><span class="mk">${r===true?"✓":r===false?"✕":""}</span>`;
    ol.appendChild(li);
  });
}
function renderHud(){
  $("hudQ").textContent = S && S.phase==="play" ? `${S.i+1}/20` : S && S.phase==="end" ? "20/20" : "–";
  $("hudC").textContent = S ? S.correct : 0;
  $("hudP").textContent = S ? S.points.toLocaleString("en-US") : 0;
  $("hudN").textContent = S ? S.name : "–";
  if(S) $("hudN").title = S.name;
  const rb=$("restartBtn");
  rb.hidden = !(S && S.phase==="play");
  resetRestartBtn();
}

const ICON_5050 = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 1.5v13" /></svg>`;
const ICON_PHONE = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.5h2l1 3-1.5 1a8 8 0 0 0 5 5l1-1.5 3 1v2a1.5 1.5 0 0 1-1.5 1.5A12.5 12.5 0 0 1 2.5 3 1.5 1.5 0 0 1 4 1.5z"/></svg>`;

function renderIntro(){
  $("sheet").innerHTML = `
  <div class="intro pop">
    <div class="meta"><span>Training round</span><span>20 questions · 50 in the bank</span></div>
    <p class="question">Think you know your FeatureManager from your 3DSwym? Climb the ladder and earn the title.</p>
    <ul>
      <li>Each round draws 20 random questions from a bank of 50: 7 easy, 7 medium and 6 hard.</li>
      <li>Pick one of the 4 answers, then press <b>Final answer</b>.</li>
      <li>A correct answer earns the points on that rung. A wrong answer earns nothing, and you keep playing.</li>
      <li>You get two lifelines per game: <b>50:50</b> removes two wrong answers, and <b>Call the expert</b> gives you a tip. Experts are good, not perfect.</li>
      <li>Every answer comes with a short explanation so you learn as you play.</li>
    </ul>
    <form class="field" id="nameForm" novalidate>
      <label for="playerName">Your name</label>
      <input id="playerName" type="text" maxlength="40" autocomplete="name" placeholder="e.g. Marie Curie" value="${esc(lastName)}">
      <div class="err" id="nameErr" role="alert"></div>
      <div><button class="btn" type="submit" id="startBtn">Start the round</button></div>
    </form>
  </div>`;
  $("nameForm").onsubmit=e=>{
    e.preventDefault();
    const name=$("playerName").value.trim();
    if(!name){ $("nameErr").textContent="Enter your name to start."; $("playerName").focus(); return; }
    lastName=name; try{ localStorage.setItem("swChampName",name); }catch(err){}
    S=newGame(name); render();
  };
  $("playerName").focus();
}

function renderQuestion(){
  const q=S.qs[S.i];
  const ansHtml = q.opts.map((o,k)=>{
    let cls="ans";
    if(S.hidden.includes(k)) cls+=" gone";
    if(S.locked){ if(k===q.ans) cls+=" good"; else if(k===S.sel) cls+=" bad"; }
    else if(k===S.sel) cls+=" sel";
    return `<button class="${cls}" data-k="${k}" ${S.locked||S.hidden.includes(k)?"disabled":""}><span class="k">${KEYS[k]}</span><span>${esc(o)}</span></button>`;
  }).join("");

  let note="";
  if(S.expertMsg && !S.locked) note=`<div class="note expert"><strong>The expert says</strong>${S.expertMsg}</div>`;
  if(S.locked){
    const ok=S.sel===q.ans;
    note=`<div class="note ${ok?"good":"bad"} pop"><strong>${ok?`Correct! +${LADDER[S.i].toLocaleString("en-US")} points`:`Not this time. The answer is ${KEYS[q.ans]}: ${esc(q.opts[q.ans])}`}</strong>${esc(q.x)}</div>`;
  }

  $("sheet").innerHTML = `
    <div class="meta"><span>Question ${S.i+1} of 20 · worth ${LADDER[S.i].toLocaleString("en-US")} pts</span><span class="tag d${q.d}">${DIFF[q.d]}</span></div>
    <h2 class="question pop">${esc(q.q)}</h2>
    <div class="answers">${ansHtml}</div>
    ${note}
    <div class="controls">
      <div class="lifelines">
        <button class="life" id="l5050" ${S.used5050||S.locked?"disabled":""} aria-label="50:50 lifeline">${ICON_5050}50:50</button>
        <button class="life" id="lExpert" ${S.usedExpert||S.locked?"disabled":""} aria-label="Call the expert lifeline">${ICON_PHONE}Call the expert</button>
      </div>
      ${S.locked
        ? `<button class="btn" id="nextBtn">${S.i===19?"See my result":"Next question"}</button>`
        : `<button class="btn" id="lockBtn" ${S.sel===null?"disabled":""}>Final answer</button>`}
    </div>`;

  document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{ if(S.locked) return; S.sel=+b.dataset.k; render(); });
  $("l5050").onclick=use5050; $("lExpert").onclick=useExpert;
  if($("lockBtn")) $("lockBtn").onclick=lockIn;
  if($("nextBtn")) $("nextBtn").onclick=next;
}

function use5050(){
  if(S.used5050||S.locked) return;
  const q=S.qs[S.i];
  const wrong=shuffle([0,1,2,3].filter(k=>k!==q.ans&&!S.hidden.includes(k)));
  S.hidden=wrong.slice(0,2); S.used5050=true;
  if(S.hidden.includes(S.sel)) S.sel=null;
  render();
}
function useExpert(){
  if(S.usedExpert||S.locked) return;
  const q=S.qs[S.i];
  const visible=[0,1,2,3].filter(k=>!S.hidden.includes(k));
  const acc = visible.length===2 ? Math.min(.97,EXPERT_ACC[q.d]+.1) : EXPERT_ACC[q.d];
  let pick = q.ans;
  if(Math.random()>acc){ const others=visible.filter(k=>k!==q.ans); pick=others[Math.floor(Math.random()*others.length)]; }
  const conf = q.d===1 ? "I use this every day. It's" : q.d===2 ? "I'm fairly confident it's" : "This one is tricky. My best guess is";
  S.expertMsg = `“${conf} <b>${KEYS[pick]}: ${esc(q.opts[pick])}</b>.”`;
  S.usedExpert=true; render();
}
function lockIn(){
  if(S.sel===null||S.locked) return;
  const q=S.qs[S.i]; const ok=S.sel===q.ans;
  S.locked=true; S.results[S.i]=ok;
  if(ok){ S.points+=LADDER[S.i]; S.correct++; }
  render();
}
function next(){
  if(S.i===19){ S.phase="end"; render(); scrollToSheet(); return; }
  S.i++; S.sel=null; S.locked=false; S.hidden=[]; S.expertMsg=null; render(); scrollToSheet();
}

function scrollToSheet(){
  const r=$("sheet").getBoundingClientRect();
  if(r.top<0||r.top>window.innerHeight*0.5) $("sheet").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
function rankFor(pct){
  if(pct>=CHAMP_PCT) return ["SOLIDWORKS Champion","You reached at least 80% of the total points. Take a bow."];
  if(pct>=0.6) return ["Expert","Very strong. A little more on the hard questions and the title is yours."];
  if(pct>=0.35) return ["Designer","Solid foundations. Review the misses below and play again."];
  if(pct>=0.15) return ["Drafter","Good start. The explanations below are your study list."];
  return ["Apprentice","Everyone starts somewhere. Play again and the questions will feel familiar."];
}
const fmt = n => n.toLocaleString("en-US");
function renderEnd(){
  const pct=S.points/TOTAL;
  const champ=pct>=CHAMP_PCT;
  const [title,line]=rankFor(pct);
  const misses=S.qs.map((q,i)=>({q,i})).filter(o=>S.results[o.i]===false);
  const rows=[1,2,3].map(d=>{
    const idx=S.qs.map((q,i)=>i).filter(i=>S.qs[i].d===d);
    const ok=idx.filter(i=>S.results[i]);
    return {d,n:idx.length,c:ok.length,pts:ok.reduce((a,i)=>a+LADDER[i],0),max:idx.reduce((a,i)=>a+LADDER[i],0)};
  });
  const goal=Math.ceil(TOTAL*CHAMP_PCT);
  $("sheet").innerHTML = `
  <div class="intro pop">
    <div class="meta"><span>Round complete · ${esc(S.name)}</span><span>${S.correct} of 20 correct</span></div>
    <div class="result-score">${fmt(S.points)} <span style="font-size:.35em;color:var(--muted)">/ ${fmt(TOTAL)} points</span></div>
    <div class="rank">${champ?"🏆 ":""}${esc(S.name)}, ${champ?"you are the SOLIDWORKS Champion!":`your rank: ${title}`}</div>
    <p>${line}</p>
    <div>
      <div class="meter" role="img" aria-label="${Math.round(pct*100)}% of total points, champion line at 80%"><i class="${champ?"champ":""}" style="width:${Math.min(100,pct*100).toFixed(1)}%"></i><span class="goal"></span></div>
      <div class="meter-labels"><span>${Math.round(pct*100)}% of total points</span><span>Champion line: 80% = ${fmt(goal)} pts</span></div>
    </div>
    ${!champ?`<p style="color:var(--muted)">You needed ${fmt(goal-S.points)} more points for the Champion title.</p>`:""}
    <div class="table-wrap"><table class="summary">
      <thead><tr><th>Level</th><th>Correct</th><th>Earned</th><th>Possible</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${DIFF[r.d]}</td><td>${r.c} / ${r.n}</td><td>${fmt(r.pts)}</td><td>${fmt(r.max)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td>Total</td><td>${S.correct} / 20</td><td>${fmt(S.points)}</td><td>${fmt(TOTAL)}</td></tr></tfoot>
    </table></div>
    ${misses.length?`<div class="meta"><span>Questions to review (${misses.length})</span></div>
    <div class="review">${misses.map(({q})=>`<div class="item">${esc(q.q)}<br><b>${esc(q.opts[q.ans])}</b> · <span style="color:var(--muted)">${esc(q.x)}</span></div>`).join("")}</div>`
    :`<div class="note good"><strong>Perfect round</strong>Every answer was right.</div>`}
    <div class="controls"><button class="btn" id="againBtn">Play again</button><button class="btn ghost" id="homeBtn">New player</button></div>
  </div>`;
  $("againBtn").onclick=()=>{ S=newGame(S.name); render(); };
  $("homeBtn").onclick=()=>{ S=null; render(); };
}

// Restart: first click asks, second click (within 4 s) restarts with the same player
let restartTimer=null;
function resetRestartBtn(){
  const rb=$("restartBtn"); clearTimeout(restartTimer); restartTimer=null;
  rb.textContent="Restart game"; rb.classList.remove("warn");
}
$("restartBtn").onclick=()=>{
  const rb=$("restartBtn");
  if(!restartTimer){
    rb.textContent="Click again to restart"; rb.classList.add("warn");
    restartTimer=setTimeout(resetRestartBtn,4000);
    return;
  }
  resetRestartBtn();
  S=newGame(S.name); render();
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  renderHud(); renderLadder();
  if(!S) renderIntro();
  else if(S.phase==="play") renderQuestion();
  else renderEnd();
}

// Keyboard: A–D to choose, Enter to lock / continue
document.addEventListener("keydown",e=>{
  if(!S||S.phase!=="play"||e.target.tagName==="INPUT") return;
  const k=KEYS.indexOf(e.key.toUpperCase());
  if(k>=0&&!S.locked&&!S.hidden.includes(k)){ S.sel=k; render(); }
  if(e.key==="Enter"){ e.preventDefault(); S.locked?next():lockIn(); }
});

function start(data){ S = data && data.S ? data.S : null; if(S && !S.name) S.name="Player"; render(); }
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
